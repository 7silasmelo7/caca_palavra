<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Título -->
        <header class="header">
            <h1>🎮 Jogo de Adivinhação</h1>
        </header>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Informações do Jogo -->
            <div class="info-section">
                <div class="tentativas">
                    <span id="tentativasText">Tentativas: 5</span>
                </div>
            </div>

            <!-- Display da Palavra -->
            <div class="palavra-container">
                <!-- Categoria -->
                <div class="categoria-display">
                    <p id="categoria" class="categoria-text">🎮 Iniciando...</p>
                </div>
                
                <div id="palavraDisplay" class="palavra-display" role="region" aria-label="Palavra a ser adivinhada" aria-live="polite">_ _ _ _ _</div>
                
                <!-- Barra de Progresso -->
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p class="progress-text">
                    <span id="progressText">0% completo</span>
                </p>
            </div>
            
            <!-- Painel de Pontuação -->
            <div class="score-panel">
                <div class="score-item">
                    <span class="score-label">🏆 Pontuação:</span>
                    <span id="scoreText" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">⭐ Recorde:</span>
                    <span id="recordeText" class="score-value">0</span>
                </div>
            </div>
            
            <!-- Teclado Virtual -->
            <div class="teclado-virtual" id="tecladoVirtual">
                <div class="teclado-linha">
                    <button class="tecla" data-letra="a">A</button>
                    <button class="tecla" data-letra="b">B</button>
                    <button class="tecla" data-letra="c">C</button>
                    <button class="tecla" data-letra="d">D</button>
                    <button class="tecla" data-letra="e">E</button>
                    <button class="tecla" data-letra="f">F</button>
                    <button class="tecla" data-letra="g">G</button>
                    <button class="tecla" data-letra="h">H</button>
                    <button class="tecla" data-letra="i">I</button>
                </div>
                <div class="teclado-linha">
                    <button class="tecla" data-letra="j">J</button>
                    <button class="tecla" data-letra="k">K</button>
                    <button class="tecla" data-letra="l">L</button>
                    <button class="tecla" data-letra="m">M</button>
                    <button class="tecla" data-letra="n">N</button>
                    <button class="tecla" data-letra="o">O</button>
                    <button class="tecla" data-letra="p">P</button>
                    <button class="tecla" data-letra="q">Q</button>
                    <button class="tecla" data-letra="r">R</button>
                </div>
                <div class="teclado-linha">
                    <button class="tecla" data-letra="s">S</button>
                    <button class="tecla" data-letra="t">T</button>
                    <button class="tecla" data-letra="u">U</button>
                    <button class="tecla" data-letra="v">V</button>
                    <button class="tecla" data-letra="w">W</button>
                    <button class="tecla" data-letra="x">X</button>
                    <button class="tecla" data-letra="y">Y</button>
                    <button class="tecla" data-letra="z">Z</button>
                </div>
            </div>

            <!-- Botão de Dica -->
            <div class="dica-section">
                <button id="btnDica" class="btn btn-dica" title="Obter dica">💡 Dica</button>
                <span id="dicasRestantes" class="dicas-contador">Dicas: 3</span>
            </div>

            <!-- Letras Usadas -->
            <div class="letras-usadas-section">
                <p id="letrasUsadasText">Letras usadas: </p>
            </div>

            <!-- Mensagem de Feedback -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Botão Novo Jogo -->
            <div class="novo-jogo-section">
                <button id="btnNovoJogo" class="btn btn-novo-jogo">🔄 Novo Jogo</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💡 Clique nas letras do teclado para jogar</p>
        </footer>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo"></h2>
            <p id="modalMensagem"></p>
            <button id="btnFecharModal" class="btn btn-modal">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
