<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Título -->
        <header class="header">
            <h1>🎮 Jogo de Adivinhação</h1>
            <button id="btnConfig" class="btn-config" title="Configurações de IA">⚙️</button>
        </header>

        <!-- Painel de Configuração de IA -->
        <div id="configPanel" class="config-panel">
            <h3>🤖 Configuração de IA</h3>
            <div class="config-content">
                <label for="apiKey">Google Gemini API Key:</label>
                <input type="password" id="apiKey" placeholder="Cole sua API key aqui">
                <button id="btnSalvarKey" class="btn btn-salvar">Salvar</button>
                <p class="config-info">🔗 <a href="https://aistudio.google.com/app/apikey" target="_blank">Obter API key gratuita</a></p>
                <div class="config-options">
                    <label>
                        <input type="checkbox" id="usarIApalavras" checked>
                        Gerar palavras com IA
                    </label>
                    <label>
                        <input type="checkbox" id="dicasIA" checked>
                        Ativar dicas inteligentes
                    </label>
                </div>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Informações do Jogo -->
            <div class="info-section">
                <div class="tentativas">
                    <span id="tentativasText">Tentativas: 5</span>
                </div>
            </div>

            <!-- Display da Palavra -->
            <div class="palavra-container">
                <div id="palavraDisplay" class="palavra-display">_ _ _ _ _</div>
            </div>

            <!-- Campo de Entrada -->
            <div class="input-section">
                <label for="letraInput">Digite uma letra:</label>
                <input 
                    type="text" 
                    id="letraInput" 
                    maxlength="1" 
                    placeholder="A"
                    autocomplete="off"
                >
                <button id="btnVerificar" class="btn btn-verificar">Verificar</button>
            </div>

            <!-- Botão de Dica -->
            <div class="dica-section">
                <button id="btnDica" class="btn btn-dica" title="Obter dica inteligente">💡 Dica com IA</button>
                <span id="dicasRestantes" class="dicas-contador">Dicas: 3</span>
            </div>

            <!-- Letras Usadas -->
            <div class="letras-usadas-section">
                <p id="letrasUsadasText">Letras usadas: </p>
            </div>

            <!-- Mensagem de Feedback -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Botão Novo Jogo -->
            <div class="novo-jogo-section">
                <button id="btnNovoJogo" class="btn btn-novo-jogo">🔄 Novo Jogo</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💡 Dica: Pressione Enter após digitar a letra</p>
        </footer>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo"></h2>
            <p id="modalMensagem"></p>
            <button id="btnFecharModal" class="btn btn-modal">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
